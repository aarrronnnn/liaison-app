name: Construire et publier Liaison

# Pousse un tag (git tag v0.9.0 && git push --tags) et GitHub construit
# le .dmg et le .exe tout seul, puis les attache a la release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Une architecture qui echoue ne doit pas emporter les autres :
      # mieux vaut publier le .exe et le .dmg Apple Silicon que rien.
      fail-fast: false
      matrix:
        include:
          # Il n'existe plus de runner macOS Intel : macos-13 a ete
          # retire en decembre 2025, macos-14 suit en novembre 2026.
          # Le .dmg x64 se construit donc en croise depuis un runner
          # Apple Silicon — electron-builder telecharge l'Electron x64
          # et empaquette ; seule la signature ad hoc reste locale.
          - os: macos-latest
            nom: mac-arm64
            args: --mac --arm64
          - os: macos-latest
            nom: mac-x64
            args: --mac --x64
          - os: windows-latest
            nom: windows
            args: --win --x64
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    steps:
      # Ces trois actions sont epinglees sur les majeures qui tournent
      # en Node 24. Les v4 tournaient en Node 20, que les runners
      # forcent desormais sur Node 24 en le signalant a chaque build —
      # et qui cessera un jour de fonctionner tout court.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # Un diagnostic AVANT la construction : quand ca casse, on veut
      # savoir sur quoi on tourne sans relancer le build a l'aveugle.
      - name: Contexte
        run: |
          node -v
          npm -v
          echo "electron-builder : $(npx electron-builder --version)"
          node -e "const p=require('./package.json');console.log('Liaison',p.version)"

      - name: Construire
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false     # pas de signature payante

      # Ce qui a reellement ete produit. Sans cette etape, un dossier
      # dist vide se voit seulement a l'etape suivante, sans dire pourquoi.
      - name: Ce qui a ete produit
        if: always()
        shell: bash
        run: ls -lh dist/ || echo "aucun dossier dist"

      - uses: actions/upload-artifact@v6
        with:
          name: liaison-${{ matrix.nom }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    # On publie meme si une plateforme a echoue : les autres fichiers
    # ont ete construits et n'ont pas a attendre.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # download-artifact doit rester sur la meme majeure que
      # upload-artifact : les deux partagent le format de stockage.
      - uses: actions/download-artifact@v6
        with: { path: dist, merge-multiple: true }
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
          name: Liaison ${{ github.ref_name }}
          body: |
            Widget de cabine pour DJ.

            **macOS** : ouvre le .dmg, glisse Liaison dans Applications, puis clic droit sur l'app -> Ouvrir.
            **Windows** : lance le .exe, puis « Informations complementaires » -> « Executer quand meme ».

            Une fois ouverte, l'app te propose l'abonnement ou la saisie d'un code.
