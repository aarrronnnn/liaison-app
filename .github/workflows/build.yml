name: Construire et publier Liaison

# Pousse un tag (git tag v0.9.0 && git push --tags) et GitHub construit
# le .dmg et le .exe tout seul, puis les attache a la release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Une architecture qui echoue ne doit pas emporter les autres :
      # mieux vaut publier le .exe et le .dmg Apple Silicon que rien.
      fail-fast: false
      matrix:
        include:
          # Il n'existe plus de runner macOS Intel : macos-13 a ete
          # retire en decembre 2025, macos-14 suit en novembre 2026.
          # Le .dmg x64 se construit donc en croise depuis un runner
          # Apple Silicon — electron-builder telecharge l'Electron x64
          # et empaquette ; seule la signature ad hoc reste locale.
          - os: macos-latest
            nom: mac-arm64
            args: --mac --arm64
            arch: arm64
            macho: arm64
          - os: macos-latest
            nom: mac-x64
            args: --mac --x64
            arch: x64
            # « file » dit x86_64, jamais x64 : chercher « x64 »
            # ne trouvait rien et faisait echouer un binaire correct.
            macho: x86_64
          - os: windows-latest
            nom: windows
            args: --win --x64
            arch: x64
            macho: ''
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    steps:
      # Ces trois actions sont epinglees sur les majeures qui tournent
      # en Node 24. Les v4 tournaient en Node 20, que les runners
      # forcent desormais sur Node 24 en le signalant a chaque build —
      # et qui cessera un jour de fonctionner tout court.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------------------------
      # L'architecture des binaires embarques.
      #
      # ffmpeg-static ne contient qu'UN SEUL binaire : celui de la
      # machine ou npm a tourne. Les runners macOS sont tous en
      # Apple Silicon depuis le retrait de macos-13 — donc le job
      # « x64 » installait un ffmpeg arm64 et l'empaquetait dans le
      # .dmg Intel. Verifie : le paquet ne contient qu'un fichier
      # « ffmpeg », pas un par plateforme.
      #
      # npm_config_arch est lu par ffmpeg-static a l'installation ET
      # au require. On le pose donc pour toute la duree du job.
      # (ffprobe-static, lui, embarque toutes les plateformes : il
      # n'a jamais eu le probleme, ce qui explique qu'on ne l'ait
      # pas vu plus tot.)
      # ------------------------------------------------------------
      - name: Installer les dependances
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_platform: ${{ startsWith(matrix.os, 'macos') && 'darwin' || 'win32' }}

      # Un diagnostic AVANT la construction : quand ca casse, on veut
      # savoir sur quoi on tourne sans relancer le build a l'aveugle.
      # Trente millisecondes ici, contre deux minutes de runner par
      # plateforme quand la configuration est refusee. Ce controle
      # existe parce qu'une seule clef inconnue dans package.json a
      # fait echouer les trois jobs a la fois.
      - name: Verifier la configuration
        shell: bash
        run: |
          # Un garde-fou qui fait echouer la construction quand il
          # est absent est pire que pas de garde-fou : c'est
          # exactement ce qui vient d'arriver. S'il n'est pas la, on
          # le signale et on continue.
          if [ -f build/verifier-config.js ]; then
            node build/verifier-config.js
          else
            echo "::warning::build/verifier-config.js absent — validation de la configuration ignoree"
          fi

      - name: Contexte
        shell: bash
        run: |
          node -v
          npm -v
          echo "machine  : $(uname -m)"
          echo "cible    : ${{ matrix.arch }}"
          echo "electron-builder : $(npx electron-builder --version)"
          node -e "const p=require('./package.json');console.log('Liaison',p.version)"

      # Le binaire embarque est-il de la bonne architecture ? On le
      # verifie AVANT de construire : une erreur ici coute trente
      # secondes, la meme erreur decouverte par un DJ sur un Mac
      # Intel coute un client.
      - name: Verifier l'architecture de ffmpeg
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          F=node_modules/ffmpeg-static/ffmpeg
          file "$F"
          if ! file "$F" | grep -qi "${{ matrix.macho }}"; then
            echo "::error::ffmpeg embarque n'est pas en ${{ matrix.macho }} : $(file "$F")"
            exit 1
          fi
          echo "ffmpeg est bien en ${{ matrix.macho }}"

      # ------------------------------------------------------------
      # La construction, et surtout : sa trace.
      #
      # Quand ce job echoue, le journal complet n'est lisible que
      # par le proprietaire du depot — pas moyen de diagnostiquer
      # une panne sans se connecter. On recopie donc la fin de la
      # sortie dans le resume du job, qui est public. La prochaine
      # panne se lira sur la page du build, sans identifiants.
      # ------------------------------------------------------------
      - name: Construire
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.args }} --publish never 2>&1 | tee /tmp/build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false     # pas de signature payante

      # Le resume disait « (aucune sortie capturee) » quand l'echec
      # arrivait AVANT la construction — c'est-a-dire precisement
      # quand on ne sait pas ce qui s'est passe. On decrit donc
      # aussi l'etat du depot au moment de l'echec.
      - name: Journal en cas d'echec
        if: failure()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.nom }} — echec"
            echo ''
            echo '### Sortie de la construction'
            echo '```'
            if [ -s /tmp/build.log ]; then tail -n 120 /tmp/build.log
            else echo "(la construction n'a pas demarre : l'echec est dans une etape precedente)"; fi
            echo '```'
            echo '### Fichiers attendus par le workflow'
            echo '```'
            for f in package.json build/verifier-config.js build/afterPack.js build/icon.png src/main.js; do
              if [ -f "$f" ]; then echo "present  $f"; else echo "ABSENT   $f"; fi
            done
            echo ''
            echo "node        $(node -v 2>&1)"
            echo "npm         $(npm -v 2>&1)"
            echo "electron-builder $(npx --no-install electron-builder --version 2>&1 | tail -1)"
            echo "app-builder-lib  $([ -d node_modules/app-builder-lib ] && echo present || echo ABSENT)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Ce qui a reellement ete produit. Sans cette etape, un dossier
      # dist vide se voit seulement a l'etape suivante, sans dire pourquoi.
      - name: Ce qui a ete produit
        if: always()
        shell: bash
        run: ls -lh dist/ || echo "aucun dossier dist"

      # Le controle qui manquait : le .dmg produit contient-il un
      # ffmpeg de la bonne architecture ? C'est la question qu'on
      # aurait du se poser avant de publier un .dmg Intel construit
      # sur une machine Apple Silicon.
      - name: Verifier le .dmg produit
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -e
          N=$(ls dist/*.dmg 2>/dev/null | wc -l | tr -d ' ')
          echo "$N fichier(s) .dmg"
          ls dist/*.dmg
          if [ "$N" != "1" ]; then
            echo "::error::attendu 1 seul .dmg pour ${{ matrix.arch }}, trouve $N"
            exit 1
          fi
          POINT=$(mktemp -d)
          hdiutil attach -nobrowse -quiet -mountpoint "$POINT" dist/*.dmg
          FF="$POINT/Liaison.app/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          if [ -f "$FF" ]; then
            file "$FF"
            if ! file "$FF" | grep -qi "${{ matrix.macho }}"; then
              hdiutil detach "$POINT" -quiet || true
              echo "::error::le .dmg ${{ matrix.arch }} embarque un ffmpeg $(file "$FF")"
              exit 1
            fi
            echo "ffmpeg dans le .dmg : ${{ matrix.macho }} — correct"
          else
            echo "::warning::ffmpeg introuvable dans le paquet ($FF)"
          fi
          hdiutil detach "$POINT" -quiet || true

      - uses: actions/upload-artifact@v6
        with:
          name: liaison-${{ matrix.nom }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    # On publie meme si une plateforme a echoue : les autres fichiers
    # ont ete construits et n'ont pas a attendre.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # download-artifact doit rester sur la meme majeure que
      # upload-artifact : les deux partagent le format de stockage.
      - uses: actions/download-artifact@v6
        with: { path: dist, merge-multiple: true }
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
          name: Liaison ${{ github.ref_name }}
          body: |
            Widget de cabine pour DJ.

            **macOS** : ouvre le .dmg, glisse Liaison dans Applications, puis clic droit sur l'app -> Ouvrir.
            **Windows** : lance le .exe, puis « Informations complementaires » -> « Executer quand meme ».

            Une fois ouverte, l'app te propose l'abonnement ou la saisie d'un code.
