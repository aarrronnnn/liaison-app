<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Liaison</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#13161B;--sunk:#0F1216;--line:#22272F;--line2:#2C333D;--ink:#E9EBEE;--dim:#79828D;--dim2:#525A64;--blue:#6E7BFF;--rose:#E0654F;
--d:Syne,"Helvetica Neue",Arial,sans-serif;--b:"Instrument Sans",system-ui,sans-serif;--m:"DM Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--b);font-size:13px;user-select:none;overflow:hidden;
border:1px solid var(--line2);border-radius:8px}
.lbl{font-family:var(--m);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.grip{display:flex;align-items:center;gap:8px;padding:10px 11px;border-bottom:1px solid var(--line);-webkit-app-region:drag}
.grip .mk{display:flex;align-items:center;gap:7px}
.grip svg{width:20px;height:12px}
.grip .nm{font-family:var(--d);font-weight:700;font-size:9.5px;letter-spacing:.24em}
.grip .act{margin-left:auto;display:flex;gap:2px;-webkit-app-region:no-drag}
.grip .act button{padding:4px 7px;border-radius:3px;color:var(--dim2);font-family:var(--m);font-size:10px}
.grip .act button:hover{background:var(--sunk);color:var(--ink)}
.ref{padding:11px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
.ref .t{font-size:13.5px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref .m{font-family:var(--m);font-size:10.5px;color:var(--dim);margin-top:4px;display:flex;gap:11px}
.ref .m b{color:#A8AFB8;font-weight:400}
.list{padding:5px;overflow:auto;max-height:330px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 8px;border:1px solid transparent;border-radius:4px}
.row:hover{background:#171B21;border-color:var(--line)}
.sc{font-family:var(--m);font-size:14px;text-align:center}
.row.best .sc{color:var(--blue)}
.n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm{font-family:var(--m);font-size:9.5px;color:#697280;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .up{color:var(--blue)}
.go{font-family:var(--m);font-size:9.5px;letter-spacing:.1em;padding:6px 9px;border-radius:3px;border:1px solid var(--line2);color:#8C95A0;white-space:nowrap}
.go:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.foot{display:flex;align-items:center;gap:3px;padding:8px 9px;border-top:1px solid var(--line)}
.chip{font-family:var(--m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:2px;border:1px solid #262C35;color:#697280}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#0D0F12}
.foot .st{margin-left:auto;font-family:var(--m);font-size:9px;color:var(--dim2);max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px 16px;color:var(--dim);font-size:12.5px;line-height:1.6;text-align:center}
.search{padding:8px 9px;border-top:1px solid var(--line);display:none}
.search.on{display:block}
.search input{width:100%;padding:9px 10px;border-radius:4px;border:1px solid var(--line2);background:var(--sunk);color:var(--ink);font:inherit;font-size:12.5px}
.sres{margin-top:5px;max-height:130px;overflow:auto}
.sres div{padding:7px 9px;border-radius:3px;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres div:hover{background:#171B21}
.toast{position:fixed;left:9px;right:9px;bottom:9px;background:var(--blue);color:#fff;font-family:var(--m);font-size:10px;letter-spacing:.08em;
padding:9px 11px;border-radius:4px;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
</style></head><body>

<div class="grip">
  <span class="mk">
    <svg viewBox="0 0 44 26" fill="none"><path d="M5 16.5C5 5 39 5 39 16.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="5" cy="21.4" r="2.8" fill="currentColor"/><circle cx="39" cy="21.4" r="2.8" fill="currentColor"/></svg>
    <span class="nm">LIAISON</span>
  </span>
  <span class="act">
    <button id="btnSearch" title="Declarer le morceau en cours">⌕</button>
    <button id="btnSettings" title="Reglages">≡</button>
    <button id="btnHide" title="Masquer">×</button>
  </span>
</div>

<div class="ref">
  <span class="lbl" id="refLbl">En attente du deck</span>
  <div class="t" id="refT">—</div>
  <div class="m"><span>KEY <b id="refK">—</b></span><span>BPM <b id="refB">—</b></span><span>É <b id="refE">—</b></span></div>
</div>

<div class="list" id="list"><div class="empty">Charge un morceau dans ton logiciel,<br>ou declare-le avec le bouton loupe.</div></div>

<div class="search" id="search">
  <input id="q" placeholder="Titre ou artiste en cours…" autocomplete="off">
  <div class="sres" id="sres"></div>
</div>

<div class="foot" id="licBar" style="display:none;border-top:1px solid var(--line);padding:9px 10px">
  <span class="lbl" id="licTxt" style="color:var(--blue)"></span>
  <button class="chip" id="licBuy" style="margin-left:auto">Prendre une licence</button>
</div>

<div class="foot">
  <button class="chip" data-arc="up" aria-pressed="true">Monter</button>
  <button class="chip" data-arc="hold" aria-pressed="false">Tenir</button>
  <button class="chip" data-arc="down" aria-pressed="false">Baisser</button>
  <button class="chip" data-mode="trend" aria-pressed="false">Tendance</button>
  <span class="st" id="st">—</span>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = p => Math.abs(p) < 0.05 ? '±0,0 %' : (p > 0 ? '+' : '−') + Math.abs(p).toFixed(1).replace('.', ',') + ' %';
let cfg = { arc: 'up', mode: 'crowd' };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1900); }

function renderNow(n) {
  $('#refLbl').textContent = n ? (n.how === 'manuel' ? 'Declare a la main' : 'Detecte sur le deck') : 'En attente du deck';
  $('#refT').textContent = n ? n.title : '—';
  $('#refK').textContent = n ? (n.key || '—') : '—';
  $('#refB').textContent = n ? Number(n.bpm).toFixed(1).replace('.', ',') : '—';
  $('#refE').textContent = n ? n.energy : '—';
}
function renderSug(list) {
  const box = $('#list');
  if (!list || !list.length) { box.innerHTML = '<div class="empty">Aucun enchainement pour le moment.<br>Importe ta bibliotheque dans les reglages.</div>'; return; }
  box.innerHTML = list.map((r, i) => `
    <div class="row ${i === 0 ? 'best' : ''}">
      <span class="sc">${r.total}</span>
      <span style="min-width:0">
        <span class="n">${esc(r.title)}</span>
        <span class="mm">${esc(r.key || '?')} · ${fmt(r.delta)} · ${esc(r.transition)}${r.trend >= 70 ? ' · <span class="up">↑</span>' : ''}</span>
      </span>
      <button class="go" data-id="${r.id}">Charger</button>
    </div>`).join('');
}

$('#list').addEventListener('click', async e => {
  const b = e.target.closest('.go'); if (!b) return;
  const r = await window.liaison.loadTrack(Number(b.dataset.id));
  if (r && r.ok) toast('« ' + r.copied +' » copie — colle dans ta recherche');
});
$('#btnSettings').onclick = () => window.liaison.openSettings();
$('#btnHide').onclick = () => window.liaison.hideWidget();
$('#btnSearch').onclick = () => { $('#search').classList.toggle('on'); $('#q').focus(); };

let tq;
$('#q').addEventListener('input', e => {
  clearTimeout(tq);
  const v = e.target.value;
  tq = setTimeout(async () => {
    const r = await window.liaison.searchTrack(v);
    $('#sres').innerHTML = r.map(x => `<div data-id="${x.id}">${esc(x.title)} <span style="color:#697280">— ${esc(x.artist)} · ${esc(x.key || '?')} · ${x.bpm}</span></div>`).join('');
  }, 200);
});
$('#sres').addEventListener('click', async e => {
  const d = e.target.closest('[data-id]'); if (!d) return;
  await window.liaison.loadTrack(Number(d.dataset.id));
  $('#search').classList.remove('on'); $('#q').value = ''; $('#sres').innerHTML = '';
});

document.querySelectorAll('[data-arc]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-arc]').forEach(o => o.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  window.liaison.setConfig({ arc: b.dataset.arc });
});
$('[data-mode]').onclick = function () {
  const on = this.getAttribute('aria-pressed') !== 'true';
  this.setAttribute('aria-pressed', on ? 'true' : 'false');
  window.liaison.setConfig({ mode: on ? 'trend' : 'crowd' });
};

window.liaison.on('now', renderNow);
window.liaison.on('suggestions', renderSug);
window.liaison.on('status', s => { $('#st').textContent = (s.ok ? '● ' : '○ ') + (s.msg || ''); });
window.liaison.on('progress', p => { $('#st').textContent = p.phase + ' ' + p.done + '/' + p.total; });
window.liaison.on('library', l => { $('#st').textContent = l.n + ' titres prets'; });
window.liaison.on('license', st => {
  const bar = $('#licBar');
  if (st.tier === 'trial') { bar.style.display = 'flex'; $('#licTxt').textContent = 'Essai — ' + st.trialLeft + ' jours'; }
  else if (st.tier === 'none') { bar.style.display = 'flex'; $('#licTxt').textContent = 'Essai termine — 1 suggestion'; }
  else bar.style.display = 'none';
});
$('#licBuy').onclick = () => window.liaison.openLicence('plans');
window.liaison.on('app', a => { $('#st').textContent = a.open ? '● ' + a.label : '○ ' + a.label + ' ferme'; });
window.liaison.on('raw', r => { if (!r.matched) $('#st').textContent = r.text; });

(async () => {
  const c = await window.liaison.getConfig();
  cfg = c.config;
  document.querySelectorAll('[data-arc]').forEach(o => o.setAttribute('aria-pressed', o.dataset.arc === cfg.arc ? 'true' : 'false'));
  $('[data-mode]').setAttribute('aria-pressed', cfg.mode === 'trend' ? 'true' : 'false');
  if (c.license) {
    const st = c.license, bar = $('#licBar');
    if (st.tier === 'trial') { bar.style.display = 'flex'; $('#licTxt').textContent = 'Essai — ' + st.trialLeft + ' jours'; }
    else if (st.tier === 'none') { bar.style.display = 'flex'; $('#licTxt').textContent = 'Essai termine — 1 suggestion'; }
  }
  renderNow(await window.liaison.nowPlaying());
  renderSug(await window.liaison.suggest());
  if (c.libraryCount) $('#st').textContent = c.libraryCount + ' titres prets';
})();
</script></body></html>
