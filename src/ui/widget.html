<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Liaison</title>
<link rel="stylesheet" href="./da.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--deep);color:var(--cream);font-family:var(--b);font-size:13px;
user-select:none;overflow:hidden;border:1px solid var(--wire2);border-radius:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lbl{color:var(--cream3)}

/* ---------- barre ---------- */
.grip{display:flex;align-items:center;gap:9px;padding:9px 10px;border-bottom:1px solid var(--wire);-webkit-app-region:drag}
.grip .mk{display:flex;align-items:center;gap:8px}
.grip .mk svg{width:17px;height:17px;display:block}
.grip .nm{font-family:var(--m);font-weight:700;font-size:9.5px;letter-spacing:.3em}
.grip .act{margin-left:auto;display:flex;gap:1px;-webkit-app-region:no-drag}
.grip .act button{width:24px;height:22px;border-radius:2px;color:var(--cream3);font-family:var(--m);font-size:12px;line-height:1}
.grip .act button:hover{background:var(--deep3);color:var(--cream)}

/* ---------- morceau en cours ---------- */
.ref{padding:11px 12px 12px;border-bottom:1px solid var(--wire);background:var(--deep2)}
.ref .top{display:flex;align-items:baseline;gap:8px}
.ref .top .lbl{color:var(--blueLit)}
.ref .t{font-family:var(--d);font-size:21px;line-height:.98;text-transform:uppercase;margin-top:7px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref .a{font-family:var(--m);font-size:10px;color:var(--cream3);margin-top:4px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref .m{font-family:var(--m);font-size:10px;color:var(--cream2);margin-top:9px;display:flex;gap:13px}
.ref .m i{font-style:normal;color:var(--cream3)}

/* ---------- ruban de structure ---------- */
.strip{margin-top:10px;height:16px;position:relative;background:var(--deep3);border-radius:2px;overflow:hidden}
.strip .seg{position:absolute;top:0;bottom:0}
.strip .body{background:linear-gradient(180deg,#243056,#1B2440)}
.strip .brk{background:repeating-linear-gradient(90deg,var(--deep3) 0 3px,#20232A 3px 6px)}
.strip .mk{position:absolute;top:0;bottom:0;width:2px}
.strip .mk.s{background:var(--blueLit)}
.strip .mk.w{background:var(--cream)}
.strip .mk.o{background:var(--redLit)}
.strip .cur{position:absolute;top:0;bottom:0;width:1px;background:#fff;opacity:.45}
.striplbl{display:flex;justify-content:space-between;font-family:var(--m);font-size:8.5px;
letter-spacing:.1em;color:var(--cream3);margin-top:4px;text-transform:uppercase}

/* ---------- liste ---------- */
.list{overflow:auto;max-height:334px;padding:4px}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:start;
padding:9px 8px 10px;border:1px solid transparent;border-radius:3px}
.row + .row{border-top:1px solid var(--wire)}
.row:hover{background:var(--deep2);border-color:var(--wire2)}
.sc{font-family:var(--d);font-size:25px;line-height:.85;text-align:right;color:var(--cream3);padding-top:1px}
.row.best .sc{color:var(--blueLit)}
.row.sos .sc{color:var(--redLit)}
.n{display:block;font-family:var(--b);font-weight:700;font-size:12.5px;letter-spacing:-.01em;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm{display:block;font-family:var(--m);font-size:9.5px;color:var(--cream3);margin-top:3px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .up{color:var(--blueLit)}
.mm .ask{color:var(--redLit);font-weight:700}
/* Deja joue : ce soir en rouge (une faute), une autre fois en gris
   (une information). La couleur porte le poids, pas le texte. */
.mm .deja{color:var(--cream3);font-weight:700}
.mm .deja.grave{color:var(--redLit)}

/* ---------- analyse de fond ----------
   Discret par construction : c'est une information, pas une
   attente. Le DJ doit pouvoir l'ignorer et mixer. */
.anbar{display:none;align-items:center;gap:8px;padding:6px 11px;
border-bottom:1px solid var(--wire);background:var(--deep2)}
.anbar.on{display:flex}
.anbar .t{font-family:var(--m);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream3);white-space:nowrap}
.anbar .hint{font-size:10px;color:var(--cream3);opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anbar .track{margin-left:auto;width:74px;height:3px;background:var(--wire2);border-radius:2px;overflow:hidden;flex:none}
.anbar .track i{display:block;height:100%;background:var(--blueLit);width:0;transition:width .4s ease}

/* ---------- filtres de cabine ---------- */
.filt{display:none;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 10px;
border-bottom:1px solid var(--wire);background:var(--deep2)}
.filt.on{display:flex}
.filt .f{font-family:var(--m);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
padding:4px 7px;border:1px solid var(--wire2);border-radius:2px;color:var(--cream3);cursor:pointer;white-space:nowrap}
.filt .f:hover{color:var(--cream);border-color:var(--cream3)}
.filt .f[aria-pressed=true]{background:var(--cream);border-color:var(--cream);color:var(--deep)}
.filt select{font-family:var(--m);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
background:var(--deep3);color:var(--cream);border:1px solid var(--wire2);border-radius:2px;
padding:4px 5px;max-width:150px;cursor:pointer}
.filt input{font-family:var(--m);font-size:9px;width:42px;text-align:center;
background:var(--deep3);color:var(--cream);border:1px solid var(--wire2);border-radius:2px;padding:4px 3px}
.filt .n{margin-left:auto;font-family:var(--m);font-size:8.5px;letter-spacing:.08em;color:var(--cream3);white-space:nowrap}
.filt .n.warn{color:var(--redLit)}

/* ---------- atterrissage ---------- */
.land{display:none;padding:9px 11px;border-bottom:1px solid var(--wire);background:var(--deep2)}
.land.on{display:block}
.land .hd{display:flex;align-items:baseline;gap:8px}
.land .ph{font-family:var(--d);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.land .ph.tenir{color:var(--cream)}
.land .ph.dernier{color:var(--redLit)}
.land .ph.poser{color:var(--blueLit)}
.land .re{margin-left:auto;font-family:var(--m);font-size:10px;color:var(--cream3);white-space:nowrap}
.land .tx{color:var(--cream2);font-size:11.5px;line-height:1.45;margin-top:4px}
.land .cl{display:flex;align-items:center;gap:6px;margin-top:7px;padding-top:7px;border-top:1px solid var(--wire)}
.land .cl b{font-family:var(--m);font-size:8px;letter-spacing:.16em;color:var(--cream3);text-transform:uppercase}
.land .cl s{text-decoration:none;font-weight:700;font-size:11.5px;min-width:0;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.land .cl button{margin-left:auto;font-family:var(--m);font-size:8px;letter-spacing:.12em;
text-transform:uppercase;color:var(--cream3);border:1px solid var(--wire2);border-radius:2px;padding:3px 6px}
.land .cl button:hover{color:var(--cream);border-color:var(--cream3)}
.land .bars{display:flex;gap:2px;align-items:flex-end;height:22px;margin-top:8px}
.land .bars i{flex:1;background:var(--wire2);border-radius:1px 1px 0 0;min-height:2px}
.land .bars i.now{background:var(--blueLit)}
.land .ask{display:none}
.land.asking .ask{display:block}
.land.asking #lPlan{display:none}
.land .ask .q{font-family:var(--d);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.land .ask .opts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.land .ask .f{font-family:var(--m);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
padding:5px 8px;border:1px solid var(--wire2);border-radius:2px;color:var(--cream3)}
.land .ask .f:hover{background:var(--cream);border-color:var(--cream);color:var(--deep)}
.land .ask input{font-family:var(--m);font-size:9px;width:56px;text-align:center;
background:var(--deep3);color:var(--cream);border:1px solid var(--wire2);border-radius:2px;padding:5px 4px}
/* plan de mix */
.plan{font-family:var(--m);font-size:9.5px;margin-top:6px;display:flex;gap:11px;
padding-top:6px;border-top:1px solid var(--wire);white-space:nowrap;overflow:hidden}
.plan b{font-weight:400;color:var(--cream3);letter-spacing:.1em;text-transform:uppercase;font-size:8.5px}
.plan s{text-decoration:none;color:var(--cream)}
.plan .k1 s{color:var(--blueLit)}
.plan .k3 s{color:var(--redLit)}
.plan.wait{color:var(--cream3);border-top-color:var(--wire);display:block}
.go{font-family:var(--m);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:6px 7px;
border-radius:2px;border:1px solid var(--wire2);color:var(--cream3);white-space:nowrap}
.go:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.row.sos .go:hover{background:var(--red);border-color:var(--red)}

.empty{padding:28px 18px;color:var(--cream3);font-size:12.5px;line-height:1.65;text-align:center}
.empty b{display:block;font-family:var(--d);font-size:15px;color:var(--cream2);text-transform:uppercase;margin-bottom:8px}

/* ---------- bandeau demandes ---------- */
.reqbar{display:none;align-items:center;gap:9px;padding:8px 11px;background:var(--blue);color:#fff;min-width:0}
.reqbar.on{display:flex}
.reqbar .t{font-family:var(--d);font-size:13px;text-transform:uppercase}
.reqbar .lbl{color:#fff;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reqbar button{margin-left:auto;font-family:var(--m);font-size:9px;letter-spacing:.12em;
text-transform:uppercase;border:1px solid rgba(255,255,255,.5);padding:5px 8px;border-radius:2px}
.reqbar button:hover{background:#fff;color:var(--blue)}
.row.req .sc{font-size:19px;color:var(--blueLit)}
.row.req.hot .sc{color:var(--redLit)}
.row .miss{font-family:var(--m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream3)}
.chip.req{position:relative}
.chip .badge{position:absolute;top:-5px;right:-5px;min-width:14px;height:14px;border-radius:7px;
background:var(--red);color:#fff;font-family:var(--m);font-size:8px;line-height:14px;text-align:center;padding:0 3px}

/* ---------- bandeau sauvetage ---------- */
.sosbar{display:none;align-items:center;gap:9px;padding:8px 11px;background:var(--red);color:#fff;min-width:0}
.sosbar.on{display:flex}
.sosbar .lbl{color:#fff;opacity:.85}
.sosbar .t{font-family:var(--d);font-size:13px;text-transform:uppercase}
.sosbar button{margin-left:auto;font-family:var(--m);font-size:9px;letter-spacing:.12em;
text-transform:uppercase;border:1px solid rgba(255,255,255,.5);padding:5px 8px;border-radius:2px}
.sosbar button:hover{background:#fff;color:var(--red)}

/* ---------- recherche ---------- */
.search{padding:8px 9px;border-top:1px solid var(--wire);display:none}
.search.on{display:block}
.search input{width:100%;padding:9px 10px;border-radius:2px;border:1px solid var(--wire2);
background:var(--deep2);color:var(--cream);font-family:var(--b);font-size:12.5px}
.search input:focus{outline:none;border-color:var(--blueLit)}
.sres{margin-top:5px;max-height:130px;overflow:auto}
.sres div{padding:7px 9px;border-radius:2px;font-size:12.5px;cursor:pointer;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres div:hover{background:var(--deep2)}

/* ---------- pied ---------- */
/* La barre du bas porte maintenant sept boutons. Sur un widget
   etroit — et il est fait pour etre etroit, il vit par-dessus le
   logiciel de mix — ils debordaient hors du cadre : le SOS,
   justement celui qu'on cherche a 2 h du matin, sortait de la
   fenetre. Elle passe donc a la ligne, et l'etat texte prend
   toute la largeur en dessous plutot que de pousser les boutons. */
.foot{display:flex;align-items:center;gap:3px;padding:7px 8px;border-top:1px solid var(--wire);flex-wrap:wrap}
.chip{font-family:var(--m);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
padding:6px 8px;border-radius:2px;border:1px solid var(--wire);color:var(--cream3);white-space:nowrap}
.chip:hover{color:var(--cream);border-color:var(--wire2)}
.chip[aria-pressed=true]{background:var(--cream);border-color:var(--cream);color:var(--deep)}
.chip.sos{border-color:#4A2119;color:var(--redLit);margin-left:2px}
.chip.sos:hover{background:var(--red);border-color:var(--red);color:#fff}
.foot .st{flex:1 0 100%;order:9;margin-top:3px;font-family:var(--m);font-size:8.5px;color:var(--cream3);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.licbar{display:none;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--wire)}
.licbar.on{display:flex}
.toast{position:fixed;left:8px;right:8px;bottom:8px;background:var(--blue);color:#fff;font-family:var(--m);
font-size:9.5px;letter-spacing:.06em;padding:9px 11px;border-radius:2px;opacity:0;transform:translateY(6px);
transition:.18s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast.red{background:var(--red)}
</style></head><body>

<div class="grip">
  <span class="mk">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3.2 3.2C8.4 8 9.9 9.6 12 12c-2.1 2.4-3.6 4-8.8 8.8" stroke="#4459FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20.8 3.2C15.6 8 14.1 9.6 12 12c2.1 2.4 3.6 4 8.8 8.8" stroke="#FF5A42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="2.5" fill="var(--deep)"/>
    </svg>
    <span class="nm">LIAISON</span>
  </span>
  <span class="act">
    <button id="btnSearch" title="Declarer le morceau en cours">⌕</button>
    <button id="btnTheme" title="Mode jour / mode nuit">☾</button>
    <button id="btnSettings" title="Reglages">≡</button>
    <button id="btnHide" title="Masquer">×</button>
  </span>
</div>

<div class="ref">
  <div class="top"><span class="lbl" id="refLbl">En attente du deck</span></div>
  <div class="t" id="refT">—</div>
  <div class="a" id="refA">—</div>
  <div class="m">
    <span>KEY <i id="refK">—</i></span>
    <span>BPM <i id="refB">—</i></span>
    <span>ÉNERGIE <i id="refE">—</i></span>
    <span id="refD"></span>
  </div>
  <div class="strip" id="strip"></div>
  <div class="striplbl" id="striplbl"><span>—</span><span>—</span></div>
</div>

<div class="reqbar" id="reqbar">
  <span class="t">Demandes</span>
  <span class="lbl" id="reqSub">Ce que la salle réclame</span>
  <button id="reqBack">Revenir</button>
</div>

<div class="sosbar" id="sosbar">
  <span class="t">Sauvetage</span>
  <span class="lbl" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Ce qui remonte la salle</span>
  <button id="sosBack">Revenir</button>
</div>

<div class="anbar" id="anBar">
  <span class="t" id="anTxt">Analyse</span>
  <span class="hint">tu peux mixer pendant ce temps</span>
  <div class="track"><i id="anFill"></i></div>
</div>

<div class="filt" id="filt">
  <select id="fCrate" title="Ne proposer que depuis cette liste"><option value="">Toute la bibliothèque</option></select>
  <button class="f" id="fPlayed" aria-pressed="false" title="Ne plus proposer ce qui est déjà passé ce soir">Pas déjà joué</button>
  <button class="f" id="fExpl" aria-pressed="false" title="Écarter ce qui est annoncé comme explicite">Sans gros mots</button>
  <button class="f" id="fBpm" aria-pressed="false" title="Verrouiller une plage de tempo">BPM</button>
  <input id="fMin" type="number" min="60" max="200" placeholder="min" style="display:none">
  <input id="fMax" type="number" min="60" max="200" placeholder="max" style="display:none">
  <span class="n" id="fN"></span>
</div>

<div class="land" id="land">
  <div class="ask" id="lAsk">
    <div class="q">Il te reste combien de temps&nbsp;?</div>
    <div class="opts">
      <button class="f" data-min="30">30 min</button>
      <button class="f" data-min="45">45 min</button>
      <button class="f" data-min="60">1 h</button>
      <button class="f" data-min="90">1 h 30</button>
      <button class="f" data-min="120">2 h</button>
      <input id="lMin" type="number" min="1" max="600" placeholder="min">
    </div>
  </div>
  <div id="lPlan">
  <div class="hd"><span class="ph" id="lPh">—</span><span class="re" id="lRe"></span></div>
  <div class="tx" id="lTx"></div>
  <div class="bars" id="lBars"></div>
  <div class="cl" id="lCl" style="display:none"><b>Clôture</b><s id="lClT"></s><button id="lClX">Changer</button></div>
  </div>
</div>

<div class="list" id="list">
  <div class="empty"><b>Demarrage</b>Liaison cherche ta bibliotheque<br>et ton logiciel de mix.</div>
</div>

<div class="search" id="search">
  <input id="q" placeholder="Titre ou artiste en cours…" autocomplete="off">
  <div class="sres" id="sres"></div>
</div>

<div class="licbar" id="licBar">
  <span class="lbl" id="licTxt" style="color:var(--blueLit)"></span>
  <button class="chip" id="licBuy" style="margin-left:auto">Prendre une licence</button>
</div>

<div class="foot">
  <button class="chip" data-arc="up" aria-pressed="true">Monter</button>
  <button class="chip" data-arc="hold" aria-pressed="false">Tenir</button>
  <button class="chip" data-arc="down" aria-pressed="false">Baisser</button>
  <button class="chip" id="btnFilt" aria-pressed="false" title="Filtres de cabine">Filtres<span class="badge" id="filtN" style="display:none">0</span></button>
  <button class="chip" id="btnLand" aria-pressed="false" title="Temps restant et descente">Fin</button>
  <button class="chip req" id="btnReq" title="Demandes des invites">Demandes<span class="badge" id="reqN" style="display:none">0</span></button>
  <button class="chip sos" id="btnSos" title="Le dancefloor se vide">SOS</button>
  <span class="st" id="st">—</span>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = p => Math.abs(p) < 0.05 ? '±0,0 %' : (p > 0 ? '+' : '−') + Math.abs(p).toFixed(1).replace('.', ',') + ' %';
const mmss = t => { if (!isFinite(t) || t < 0) t = 0; const m = Math.floor(t / 60), s = Math.round(t % 60);
  return m + ':' + (s < 10 ? '0' : '') + (s === 60 ? 0 : s); };
let cfg = { arc: 'up', mode: 'crowd' };

/* La fenetre epouse son contenu : trois propositions ou une seule,
   le widget ne laisse jamais de vide noir au-dessus du logiciel. */
let hTimer = null, lastH = 0;
function fitHeight() {
  clearTimeout(hTimer);
  hTimer = setTimeout(() => {
    const h = Math.ceil(document.body.getBoundingClientRect().height) + 2;
    if (h && Math.abs(h - lastH) > 3 && window.liaison.setHeight) {
      lastH = h;
      window.liaison.setHeight(Math.max(180, Math.min(760, h)));
    }
  }, 60);
}
let view = 'sug', lastSug = [], lastReq = [], curStruct = null;

function toast(msg, red) {
  const t = $('#toast'); t.textContent = msg;
  t.className = 'toast on' + (red ? ' red' : '');
  setTimeout(() => t.className = 'toast' + (red ? ' red' : ''), 1900);
}

/* ---------- ruban de structure ----------
   Ce que le DJ doit voir d'un coup d'oeil : ou la batterie arrive,
   ou elle part, et ou se trouvent les creux. Les trois reperes du
   plan de mix de la meilleure proposition sont poses par-dessus. */
function renderStrip(st, plan) {
  const strip = $('#strip'), lab = $('#striplbl');
  if (!st || !st.ok || !st.duration) {
    strip.innerHTML = '';
    lab.innerHTML = '<span>Analyse de la structure…</span><span></span>';
    return;
  }
  const D = st.duration, pc = t => Math.max(0, Math.min(100, (t / D) * 100));
  let h = '<div class="seg body" style="left:' + pc(st.readyAt) + '%;right:' + (100 - pc(st.outPoint)) + '%"></div>';
  for (const b of st.breaks || [])
    h += '<div class="seg brk" style="left:' + pc(b.start) + '%;right:' + (100 - pc(b.end)) + '%"></div>';
  if (plan && plan.ok) {
    h += '<div class="mk s" style="left:' + pc(plan.start) + '%" title="Lance B"></div>';
    h += '<div class="mk w" style="left:' + pc(plan.swap) + '%" title="Bascule les basses"></div>';
    h += '<div class="mk o" style="left:' + pc(plan.out) + '%" title="Sors A"></div>';
  }
  strip.innerHTML = h;
  const ov = plan && plan.ok ? ' · Recouvrement ' + plan.overlapBars + ' mes.' : '';
  lab.innerHTML = '<span>Intro ' + st.introBars + ' · Outro ' + st.outroBars + ov + '</span>' +
                  '<span>' + mmss(D) + '</span>';
}

let curNow = null;
function renderNow(n) {
  curNow = n;
  $('#refLbl').textContent = n ? (n.how === 'manuel' ? 'Declare a la main' : 'Sur le deck')
    : (etatAn.library ? 'Lance un morceau' : 'En attente');
  $('#refT').textContent = n ? n.title : '—';
  $('#refA').textContent = n ? (n.artist || '') : '—';
  $('#refK').textContent = n ? (n.key || '—') : '—';
  $('#refB').textContent = n ? Number(n.bpm).toFixed(1).replace('.', ',') : '—';
  $('#refE').textContent = n ? n.energy : '—';
  if (n && n.structure) curStruct = n.structure;
  if (!n) { curStruct = null; renderStrip(null); }
  else renderStrip(curStruct, lastSug[0] && lastSug[0].plan);
}

function planHTML(r) {
  if (!r.plan) return '<div class="plan wait">Points de mix en cours de calcul…</div>';
  if (!r.plan.ok) return '<div class="plan wait">' + esc(r.plan.note || '') + '</div>';
  const p = r.plan;
  if (p.tight)
    return '<div class="plan"><span class="k1"><b>Lance</b> <s>' + p.startLabel + '</s></span>' +
           '<span class="k3"><b>Coupe</b> <s>' + p.swapLabel + '</s></span>' +
           '<span><b>Intro</b> <s>' + p.introPlayed + ' s</s></span></div>';
  return '<div class="plan" title="Recouvrement ' + p.overlapBars + ' mesures">' +
    '<span class="k1"><b>Lance</b> <s>' + p.startLabel + '</s></span>' +
    '<span class="k2"><b>Basses</b> <s>' + p.swapLabel + '</s></span>' +
    '<span class="k3"><b>Sors</b> <s>' + p.outLabel + '</s></span></div>';
}

/* ------------------------------------------------------------
   Jour / nuit.

   On ne repeint rien : on pose un attribut sur la racine et les
   variables de da.css font le reste. Le choix suit le DJ d'une
   soiree a l'autre, donc il est enregistre.
   ------------------------------------------------------------ */
function appliquerTheme(t) {
  const jour = t === 'jour';
  document.documentElement.setAttribute('data-theme', jour ? 'jour' : 'nuit');
  /* la lune propose la nuit, le soleil propose le jour :
     l'icone montre ce qu'on obtient en cliquant */
  const b = $('#btnTheme');
  b.textContent = jour ? '☾' : '☀';
  b.title = jour ? 'Passer en mode nuit' : 'Passer en mode jour';
}
$('#btnTheme').onclick = () => {
  cfg.theme = cfg.theme === 'jour' ? 'nuit' : 'jour';
  appliquerTheme(cfg.theme);
  window.liaison.setConfig({ theme: cfg.theme });
};

/* ------------------------------------------------------------
   Dire pourquoi, pas seulement quoi.

   « Rien a proposer » sans explication envoie le DJ chercher une
   panne qui n'existe pas. Les trois causes reelles sont : pas de
   bibliotheque, pas de morceau detecte, ou un filtre trop serre —
   et chacune a sa reponse.
   ------------------------------------------------------------ */
let etatAn = { library: 0, analyses: 0, offline: 0, restants: 0, sansFils: false, importing: false };

function etatVide() {
  if (etatAn.importing)
    return '<div class="empty"><b>Lecture de ta bibliotheque</b>Liaison lit la base de ton logiciel.<br>Quelques secondes.</div>';
  if (!etatAn.library)
    return '<div class="empty"><b>Aucune bibliotheque</b>Ouvre les reglages et lance la detection,<br>ou pointe ton dossier de musique.</div>';
  if (!curNow)
    return '<div class="empty"><b>Aucun morceau detecte</b>Lance un titre dans ton logiciel de mix,<br>ou declare-le avec la loupe ci-dessus.</div>';
  if (etatAn.offline >= etatAn.library * 0.5 && etatAn.offline > 10)
    return '<div class="empty"><b>Disque introuvable</b>' + etatAn.offline + ' morceaux pointent un disque<br>qui n\'est pas branche.</div>';
  return '<div class="empty"><b>Rien ne se cale</b>Aucun titre ne s\'enchaine sur ce tempo.<br>Desserre les filtres, ou passe par un relais.</div>';
}

/* Le bandeau d'analyse : il dit que ca travaille, et surtout que
   le DJ peut mixer pendant ce temps. */
function renderAnalyse(p) {
  const bar = $('#anBar');
  if (!p || p.fini || !p.total || p.restants === 0) { bar.classList.remove('on'); fitHeight(); return; }
  bar.classList.add('on');
  const fait = p.total - p.restants;
  $('#anTxt').textContent = 'Analyse ' + fait.toLocaleString('fr-FR') + ' / ' + p.total.toLocaleString('fr-FR');
  $('#anFill').style.width = Math.round(fait / p.total * 100) + '%';
  fitHeight();
}

/* « Tu l'as deja passe ». Ce soir, c'est rouge : c'est la faute que
   personne ne pardonne. Une autre soiree, c'est gris : c'est une
   information, et parfois c'est meme une bonne raison de le rejouer. */
function dejaHTML(r) {
  if (!r.deja || !r.deja.texte) return '';
  return '<span class="deja' + (r.deja.grave ? ' grave' : '') + '">' + esc(r.deja.texte) + '</span> · ';
}

function renderSug(list) {
  lastSug = list || [];
  if (view !== 'sug') return;
  const box = $('#list');
  if (!list || !list.length) {
    box.innerHTML = etatVide();
    fitHeight();
    return;
  }
  box.innerHTML = list.map((r, i) => `
    <div class="row ${i === 0 ? 'best' : ''}">
      <span class="sc">${r.total}</span>
      <span style="min-width:0">
        <span class="n">${esc(r.title)}</span>
        <span class="mm">${r.client ? '<span class="ask">DEMANDÉ</span> · ' : ''}${dejaHTML(r)}${esc(r.artist || '')} · ${esc(r.key || '?')} · ${fmt(r.delta)} · ${esc(r.transition)}${r.trend >= 70 ? ' · <span class="up">TENDANCE</span>' : ''}</span>
        ${planHTML(r)}
      </span>
      <button class="go" data-id="${r.id}">Copier</button>
    </div>`).join('');
  renderStrip(curStruct, list[0] && list[0].plan);
  fitHeight();
}

function renderSos(list) {
  const box = $('#list');
  if (!list || !list.length) {
    box.innerHTML = curNow
      ? '<div class="empty"><b>Rien de mixable</b>Aucun titre assez fort ne se cale sur ce tempo.<br>Passe par un morceau relais.</div>'
      : '<div class="empty"><b>Aucun morceau detecte</b>Le sauvetage part de ce qui tourne :<br>lance un titre, ou declare-le avec la loupe.</div>';
    return;
  }
  box.innerHTML = list.map(r => `
    <div class="row sos">
      <span class="sc">${r.total}</span>
      <span style="min-width:0">
        <span class="n">${esc(r.title)}</span>
        <span class="mm">${r.client ? '<span class="ask">DEMANDÉ</span> · ' : ''}${dejaHTML(r)}${esc(r.artist || '')} · ${esc(r.key || '?')} · ${fmt(r.delta)} · É ${r.energy} · ${esc(r.why)}</span>
        ${planHTML(r)}
      </span>
      <button class="go" data-id="${r.id}">Copier</button>
    </div>`).join('');
  fitHeight();
}

/* ---------- interactions ---------- */
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('.go'); if (!b) return;
  const r = await window.liaison.loadTrack(Number(b.dataset.id));
  if (r && r.ok) toast('« ' + r.copied + ' » copie — colle dans ta recherche', view === 'sos');
});
$('#btnSettings').onclick = () => window.liaison.openSettings();
$('#btnHide').onclick = () => window.liaison.hideWidget();
$('#btnSearch').onclick = () => { $('#search').classList.toggle('on'); $('#q').focus(); fitHeight(); };

function setView(v) {
  view = v;
  $('#sosbar').classList.toggle('on', v === 'sos');
  $('#reqbar').classList.toggle('on', v === 'req');
}

async function enterSos() {
  setView('sos');
  $('#list').innerHTML = '<div class="empty"><b>Sauvetage</b>Recherche…</div>';
  try { renderSos(await window.liaison.rescue()); }
  catch (e) { $('#list').innerHTML = '<div class="empty"><b>Indisponible</b>Charge d\'abord un morceau.</div>'; }
}
function backToSug() { setView('sug'); renderSug(lastSug); fitHeight(); }
$('#btnSos').onclick = () => (view === 'sos' ? backToSug() : enterSos());
$('#sosBack').onclick = backToSug;

/* ---------- demandes des invites ----------
   Le compte est un nombre de telephones distincts, pas de clics :
   « 4 demandes » veut dire quatre personnes, et ca se lit autrement. */
function renderReq(list) {
  lastReq = list || [];
  const hot = lastReq.filter(r => r.n >= 3).length;
  const b = $('#reqN');
  b.style.display = lastReq.length ? 'block' : 'none';
  b.textContent = lastReq.length;
  b.style.background = hot ? 'var(--red)' : 'var(--wire2)';
  if (view !== 'req') return;

  const box = $('#list');
  if (!lastReq.length) {
    box.innerHTML = '<div class="empty"><b>Aucune demande</b>Ouvre une session dans les reglages,<br>puis affiche le QR au bar.</div>';
    fitHeight(); return;
  }
  $('#reqSub').textContent = lastReq.length + ' titre' + (lastReq.length > 1 ? 's' : '') +
    (hot ? ' · ' + hot + ' très demandé' + (hot > 1 ? 's' : '') : '');
  box.innerHTML = lastReq.map(r => `
    <div class="row req ${r.n >= 3 ? 'hot' : ''}">
      <span class="sc">${r.n}</span>
      <span style="min-width:0">
        <span class="n">${esc(r.title)}</span>
        <span class="mm">${esc(r.artist || '')}${r.have
          ? ' · ' + esc(r.match.key || '?') + ' · ' + Number(r.match.bpm).toFixed(1).replace('.', ',')
          : ' · <span class="miss">pas dans ta bibliothèque</span>'}</span>
      </span>
      ${r.have ? `<button class="go" data-id="${r.id}">Copier</button>` : '<span class="go" style="opacity:.35">—</span>'}
    </div>`).join('');
  fitHeight();
}

async function enterReq() {
  setView('req');
  $('#list').innerHTML = '<div class="empty"><b>Demandes</b>Lecture…</div>';
  try { renderReq(await window.liaison.requests()); }
  catch (e) { renderReq([]); }
}
$('#btnReq').onclick = () => (view === 'req' ? backToSug() : enterReq());
$('#reqBack').onclick = backToSug;
window.liaison.on('requests', renderReq);

let tq;
$('#q').addEventListener('input', e => {
  clearTimeout(tq);
  const v = e.target.value;
  tq = setTimeout(async () => {
    const r = await window.liaison.searchTrack(v);
    $('#sres').innerHTML = r.map(x => `<div data-id="${x.id}">${esc(x.title)} <span style="color:var(--cream3)">— ${esc(x.artist)} · ${esc(x.key || '?')} · ${x.bpm}</span></div>`).join('');
  }, 200);
});
$('#sres').addEventListener('click', async e => {
  const d = e.target.closest('[data-id]'); if (!d) return;
  await window.liaison.loadTrack(Number(d.dataset.id));
  $('#search').classList.remove('on'); $('#q').value = ''; $('#sres').innerHTML = '';
});

document.querySelectorAll('[data-arc]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-arc]').forEach(o => o.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  window.liaison.setConfig({ arc: b.dataset.arc });
  if (view !== 'sug') backToSug();
});

/* ============================================================
   Les filtres de cabine.

   Quatre interrupteurs qui retirent des morceaux. Ils ne remontent
   jamais rien : c'est ce qui les rend previsibles a 2 h du matin.
   Le compte a droite dit combien de titres restent — s'il tombe
   trop bas, on le dit en rouge plutot que de vider le widget.
   ============================================================ */
let fEtat = { crate: null, skipPlayed: false, noExplicit: false, bpmMin: 0, bpmMax: 0 };

function renderFiltCount(r) {
  const n = $('#fN'), badge = $('#filtN');
  const actifs = (fEtat.crate ? 1 : 0) + (fEtat.skipPlayed ? 1 : 0) +
                 (fEtat.noExplicit ? 1 : 0) + ((fEtat.bpmMin || fEtat.bpmMax) ? 1 : 0);
  badge.style.display = actifs ? 'block' : 'none';
  badge.textContent = actifs;
  badge.style.background = r && r.vide ? 'var(--red)' : 'var(--wire2)';
  if (!r) { n.textContent = ''; return; }
  n.classList.toggle('warn', !!r.vide);
  /* Espace insecable fine entre les milliers : « 22 000 », pas
     « 22000 ». C'est la regle francaise, et sur un chiffre a cinq
     positions ca change vraiment la lecture d'un coup d'oeil. */
  const nb = x => Number(x || 0).toLocaleString('fr-FR');
  n.textContent = r.vide
    ? 'Trop etroit — filtres ignores'
    : (actifs ? nb(r.restants) + ' / ' + nb(r.total) + ' titres' : nb(r.total) + ' titres');
}

function paintFilt() {
  $('#fPlayed').setAttribute('aria-pressed', fEtat.skipPlayed ? 'true' : 'false');
  $('#fExpl').setAttribute('aria-pressed', fEtat.noExplicit ? 'true' : 'false');
  const bpmOn = !!(fEtat.bpmMin || fEtat.bpmMax);
  $('#fBpm').setAttribute('aria-pressed', bpmOn ? 'true' : 'false');
  $('#fMin').style.display = $('#fMax').style.display = bpmOn ? 'block' : 'none';
  $('#fCrate').value = fEtat.crate || '';
}

async function pushFilt(patch) {
  const r = await window.liaison.setFilters(patch);
  renderFiltCount(r);
  fitHeight();
}

async function loadFilt() {
  const r = await window.liaison.filters();
  fEtat = r.etat;
  const sel = $('#fCrate');
  sel.innerHTML = '<option value="">Toute la bibliothèque</option>' +
    r.crates.map(c => `<option value="${esc(c.id)}">${esc(c.name)} · ${c.n}</option>`).join('');
  if (!r.crates.length) sel.innerHTML += '<option value="" disabled>Aucune liste trouvée</option>';
  $('#fMin').value = fEtat.bpmMin || '';
  $('#fMax').value = fEtat.bpmMax || '';
  paintFilt();
  renderFiltCount(r);
}

$('#btnFilt').onclick = async () => {
  const on = !$('#filt').classList.contains('on');
  $('#filt').classList.toggle('on', on);
  $('#btnFilt').setAttribute('aria-pressed', on ? 'true' : 'false');
  if (on) await loadFilt();
  fitHeight();
};
$('#fCrate').onchange = e => { fEtat.crate = e.target.value || null; paintFilt(); pushFilt({ fCrate: fEtat.crate }); };
$('#fPlayed').onclick = () => { fEtat.skipPlayed = !fEtat.skipPlayed; paintFilt(); pushFilt({ fSkipPlayed: fEtat.skipPlayed }); };
$('#fExpl').onclick = () => { fEtat.noExplicit = !fEtat.noExplicit; paintFilt(); pushFilt({ fNoExplicit: fEtat.noExplicit }); };
$('#fBpm').onclick = async () => {
  if (fEtat.bpmMin || fEtat.bpmMax) { fEtat.bpmMin = 0; fEtat.bpmMax = 0; }
  else {
    /* Un clic doit donner une plage utile tout de suite. On la centre sur
       le tempo joue, a plus ou moins 6 % — au-dela, un morceau cale
       s'entend. Sans morceau charge, on ouvre grand et le DJ ajuste. */
    const r = await window.liaison.filters();
    const b = r.bpm || 0;
    fEtat.bpmMin = b ? Math.round(b * 0.94) : 110;
    fEtat.bpmMax = b ? Math.round(b * 1.06) : 132;
  }
  $('#fMin').value = fEtat.bpmMin || '';
  $('#fMax').value = fEtat.bpmMax || '';
  paintFilt();
  pushFilt({ fBpmMin: fEtat.bpmMin, fBpmMax: fEtat.bpmMax });
};
let fT;
[['#fMin', 'fBpmMin'], ['#fMax', 'fBpmMax']].forEach(([sel, k]) => {
  $(sel).addEventListener('input', e => {
    clearTimeout(fT);
    const v = Math.max(0, Math.min(220, parseInt(e.target.value, 10) || 0));
    fEtat[k === 'fBpmMin' ? 'bpmMin' : 'bpmMax'] = v;
    fT = setTimeout(() => pushFilt({ [k]: v }), 350);
  });
});
window.liaison.on('filters', renderFiltCount);

/* ============================================================
   L'atterrissage de fin de set.

   Le DJ annonce le temps qui reste ; Liaison decoupe la descente
   et reserve la cloture. La barre se rafraichit toute seule :
   c'est le seul endroit de l'app ou le temps qui passe change
   l'affichage sans qu'un morceau ait bouge.
   ============================================================ */
let landTimer = null, landData = null;

function renderLand(p) {
  landData = p;
  const box = $('#land');
  if (!p || !p.ok || !p.phase) {
    if (!box.classList.contains('asking')) {
      box.classList.remove('on');
      $('#btnLand').setAttribute('aria-pressed', 'false');
    }
    clearInterval(landTimer); landTimer = null;
    landData = null;
    fitHeight(); return;
  }
  box.classList.add('on');
  box.classList.remove('asking');
  $('#btnLand').setAttribute('aria-pressed', 'true');
  const ph = p.phase;
  $('#lPh').className = 'ph ' + ph.k;
  $('#lPh').textContent = ph.nom;
  $('#lRe').textContent = ph.reste + ' min · fin ' + p.fin;
  $('#lTx').textContent = ph.texte;

  /* la courbe visee, en barres : la barre courante s'allume */
  const ecoule = p.restant - ph.reste;
  $('#lBars').innerHTML = p.arc.map(a =>
    `<i style="height:${Math.max(8, Math.round(a.e * 10))}%" class="${
      Math.abs(a.min - ecoule) <= p.restant / 20 ? 'now' : ''}"></i>`).join('');

  const cl = $('#lCl');
  if (p.closer) {
    cl.style.display = 'flex';
    $('#lClT').textContent = (p.closer.artist ? p.closer.artist + ' — ' : '') + p.closer.title;
    $('#lClT').style.color = ph.liberer ? 'var(--blueLit)' : 'var(--cream)';
  } else cl.style.display = 'none';
  fitHeight();
}

async function refreshLand() {
  const p = await window.liaison.landingGet();
  renderLand(p);
  if (p && p.ok && !landTimer) landTimer = setInterval(refreshLand, 60000);
}

/* Electron n'a pas window.prompt : on demande dans le widget lui-meme,
   avec les durees qu'un DJ annonce vraiment. Taper au clavier reste
   possible, mais un clic doit suffire. */
async function poserPlan(m) {
  if (!(m > 0)) { toast('Donne un nombre de minutes', true); return; }
  const p = await window.liaison.landingPlan(m);
  $('#land').classList.remove('asking');
  renderLand(p);
  if (p && p.ok) toast(p.note);
}

$('#btnLand').onclick = () => {
  const box = $('#land');
  if (landData && landData.ok) {
    window.liaison.landingClear();
    renderLand(null);
    toast('Plan de fin efface — retour a la courbe de la soiree');
    return;
  }
  const on = !(box.classList.contains('on') && box.classList.contains('asking'));
  box.classList.toggle('on', on);
  box.classList.toggle('asking', on);
  $('#btnLand').setAttribute('aria-pressed', on ? 'true' : 'false');
  if (on) setTimeout(() => $('#lMin').focus(), 40);
  fitHeight();
};
$('#lAsk').addEventListener('click', e => {
  const b = e.target.closest('[data-min]');
  if (b) poserPlan(Number(b.dataset.min));
});
$('#lMin').addEventListener('keydown', e => {
  if (e.key === 'Enter') poserPlan(parseInt(e.target.value, 10));
  if (e.key === 'Escape') { $('#land').classList.remove('on', 'asking'); $('#btnLand').setAttribute('aria-pressed', 'false'); fitHeight(); }
});
$('#lClX').onclick = async () => {
  /* Rejouer le plan : le moteur reprend la meilleure cloture restante,
     celle qu'il vient de reserver etant desormais deja proposee. */
  if (!landData || !landData.ok) return;
  const p = await window.liaison.landingPlan(landData.phase ? landData.phase.reste : landData.restant);
  renderLand(p);
};

function licState(st) {
  const bar = $('#licBar');
  if (st.tier === 'trial') { bar.classList.add('on'); $('#licTxt').textContent = 'Essai — ' + st.trialLeft + ' jours'; }
  else if (st.tier === 'none') { bar.classList.add('on'); $('#licTxt').textContent = 'Essai termine — 1 suggestion'; }
  else bar.classList.remove('on');
}

window.liaison.on('now', renderNow);
window.liaison.on('suggestions', renderSug);
window.liaison.on('analysis', p => {
  renderAnalyse(p);
  if (p && p.total != null) { etatAn.restants = p.restants; etatAn.analyses = p.done; }
  /* si la liste est vide, son message a peut-etre change */
  if (view === 'sug' && !lastSug.length) $('#list').innerHTML = etatVide();
});
window.liaison.on('status', s => { $('#st').textContent = (s.ok ? '● ' : '○ ') + (s.msg || ''); });
window.liaison.on('progress', p => { $('#st').textContent = p.phase + ' ' + p.done + '/' + p.total; });
window.liaison.on('library', async l => {
  $('#st').textContent = l.n.toLocaleString('fr-FR') + ' titres prets';
  try { etatAn = Object.assign(etatAn, await window.liaison.analysisState()); } catch (e) {}
  if (view === 'sug' && !lastSug.length) $('#list').innerHTML = etatVide();
});
window.liaison.on('license', st => { licState(st); fitHeight(); });
window.liaison.on('app', a => { $('#st').textContent = a.open ? '● ' + a.label : '○ ' + a.label + ' ferme'; });
window.liaison.on('raw', r => { if (!r.matched) $('#st').textContent = r.text; });
$('#licBuy').onclick = () => window.liaison.openLicence('plans');

(async () => {
  const c = await window.liaison.getConfig();
  cfg = c.config;
  appliquerTheme(cfg.theme);
  refreshLand();
  window.liaison.filters().then(renderFiltCount).catch(() => {});
  try { etatAn = Object.assign(etatAn, await window.liaison.analysisState()); } catch (e) {}
  if (!lastSug.length) $('#list').innerHTML = etatVide();
  document.querySelectorAll('[data-arc]').forEach(o => o.setAttribute('aria-pressed', o.dataset.arc === cfg.arc ? 'true' : 'false'));
  if (c.license) licState(c.license);
  const n = await window.liaison.nowPlaying();
  if (n && n.id != null) { try { curStruct = await window.liaison.structure(n.id); } catch (e) {} }
  renderNow(n);
  renderSug(await window.liaison.suggest());
  if (c.libraryCount) $('#st').textContent = c.libraryCount + ' titres prets';
  fitHeight();
})();
</script></body></html>
